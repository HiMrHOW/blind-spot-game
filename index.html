      bird:{label:'鸟型',desc:'参考侧面简笔鸟：圆头尖喙、弧形身体、单片翅膀、长尾和双脚。',headRadius:42,lineWidth:17,points:{head:{x:650,y:145},beak:{x:745,y:165},neck:{x:605,y:210},chest:{x:610,y:285},belly:{x:530,y:385},back:{x:455,y:250},tailRoot:{x:430,y:330},tailMid:{x:305,y:420},tailTip:{x:160,y:500},wingShoulder:{x:560,y:225},wingElbow:{x:500,y:300},wingTip:{x:395,y:365},hipL:{x:500,y:375},kneeL:{x:480,y:445},footL:{x:435,y:500},hipR:{x:550,y:378},kneeR:{x:555,y:450},footR:{x:520,y:505}},segments:[['head','beak'],['head','neck'],['neck','chest'],['chest','belly'],['belly','tailRoot'],['tailRoot','back'],['back','neck'],['tailRoot','tailMid'],['tailMid','tailTip'],['wingShoulder','wingElbow'],['wingElbow','wingTip'],['hipL','kneeL'],['kneeL','footL'],['hipR','kneeR'],['kneeR','footR']],parts:['头部','颈部','胸部','腹部','躯干','背部','背部','尾羽','尾羽','翅膀','翅膀','左腿','左腿','右腿','右腿'],handles:['head','neck','chest','tailRoot','tailMid','tailTip','wingShoulder','wingElbow','wingTip','kneeL','footL','kneeR','footR'],structural:[['head','beak'],['neck','belly'],['neck','tailRoot'],['chest','back'],['chest','tailRoot'],['back','belly'],['wingShoulder','belly'],['wingShoulder','neck'],['belly','hipL'],['belly','hipR'],['hipL','hipR']]}
    };
    for(const def of Object.values(creatures)){const all=[...def.segments,...def.structural];def.constraints=all.map(([a,b],i)=>({a,b,rest:distance(def.points[a],def.points[b]),min:i>=def.segments.length ? .985 : .86,max:i>=def.segments.length ? 1.015 : 1.14}))}
    let saved={};try{saved=JSON.parse(localStorage.getItem('blindSpotResources')||'{}')}catch{}let coins=Number.isFinite(saved.coins)?saved.coins:9999,hints=Number.isFinite(saved.hints)?saved.hints:3;
    let creature='human',phase='setup',points=clone(creatures.human.points),drag=null,lastDelta={x:0,y:0},jiggle=0,shots=[],hits=new Set(),bonus=0,toastTimer=0;
    const canvas=$('#game'),ctx=canvas.getContext('2d'),def=()=>creatures[creature];
    function persist(){localStorage.setItem('blindSpotResources',JSON.stringify({coins,hints}));resources()}function resources(){$('#coinTop').textContent=coins;$('#hintTop').textContent=hints}
    function solve(source,pin,target){const p=clone(source);p[pin]={...target};for(let n=0;n<128;n++){for(const c of def().constraints){const a=p[c.a],b=p[c.b],dx=b.x-a.x,dy=b.y-a.y,len=Math.max(.001,Math.hypot(dx,dy)),want=Math.max(c.rest*c.min,Math.min(c.rest*c.max,len));if(Math.abs(len-want)<.05)continue;const cx=dx*(len-want)/len,cy=dy*(len-want)/len;if(c.a===pin){b.x-=cx;b.y-=cy}else if(c.b===pin){a.x+=cx;a.y+=cy}else{a.x+=cx/2;a.y+=cy/2;b.x-=cx/2;b.y-=cy/2}}p[pin]={...target}}Object.values(p).forEach(v=>{v.x=Math.max(42,Math.min(W-42,v.x));v.y=Math.max(42,Math.min(H-42,v.y))});return p}
    function orient(a,b,c){return(b.y-a.y)*(c.x-b.x)-(b.x-a.x)*(c.y-b.y)}function cross(a,b,c,d){return orient(a,b,c)*orient(a,b,d)<0&&orient(c,d,a)*orient(c,d,b)<0}function overlaps(){let n=0;def().segments.forEach((u,i)=>def().segments.slice(i+1).forEach(v=>{if(u.some(k=>v.includes(k)))return;if(cross(points[u[0]],points[u[1]],points[v[0]],points[v[1]]))n++}));return n}
    function bodyPolygon(){if(creature==='cat')return[points.neck,points.shoulder,points.spine,points.hip,points.bellyBack,points.bellyFront];if(creature==='bird')return[points.neck,points.chest,points.belly,points.tailRoot,points.back];return[]}

      strokeChain(['head','neck'],15);ctx.beginPath();ctx.moveTo(points.beak.x,points.beak.y);ctx.lineTo(points.head.x+29,points.head.y-10);ctx.lineTo(points.head.x+31,points.head.y+16);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.lineWidth=4;for(const foot of [points.footL,points.footR]){for(const dx of [-18,0,18]){ctx.beginPath();ctx.moveTo(foot.x,foot.y);ctx.lineTo(foot.x+dx,foot.y+10);ctx.stroke()}}
    }ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(points.head.x,points.head.y,def().headRadius,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=8;ctx.stroke();ctx.restore()}
    function figure(joints=true,alpha=1){ctx.save();ctx.globalAlpha=alpha;if(creature==='human'){ctx.strokeStyle='#111';ctx.lineWidth=def().lineWidth;ctx.lineCap='round';ctx.lineJoin='round';for(const [a,b] of def().segments){ctx.beginPath();ctx.moveTo(points[a].x,points[a].y);ctx.lineTo(points[b].x,points[b].y);ctx.stroke()}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(points.head.x,points.head.y,def().headRadius,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=8;ctx.stroke()}else animalSilhouette();if(joints){const handles=new Set(def().handles||Object.keys(points));for(const [k,p] of Object.entries(points)){if(!handles.has(k))continue;ctx.beginPath();ctx.arc(p.x,p.y,k==='head'?8:8.5,0,Math.PI*2);ctx.fillStyle=k==='head'?'#ff4f36':'#fff';ctx.fill();ctx.strokeStyle='#ff4f36';ctx.lineWidth=3.5;if(k!=='head')ctx.stroke()}}ctx.restore()}
    function paint(s,i){ctx.save();ctx.globalAlpha=.9;ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.x,s.y,RADIUS,0,Math.PI*2);ctx.fill();for(let k=0;k<7;k++){const a=i*1.73+k*.92,r=RADIUS+7+(k*11+i*5)%18;ctx.beginPath();ctx.arc(s.x+Math.cos(a)*r,s.y+Math.sin(a)*r,2+(k+i)%4,0,Math.PI*2);ctx.fill()}if(s.gain>0){ctx.globalAlpha=1;ctx.strokeStyle='#111';ctx.lineWidth=7;ctx.beginPath();ctx.arc(s.x,s.y,RADIUS+3,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(s.x,s.y,RADIUS-9,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(s.x,s.y,9,0,Math.PI*2);ctx.fill();if(s.headshot){ctx.fillStyle='#fff';ctx.font='900 8px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('1.5×',s.x,s.y)}}ctx.restore()}
    function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);if(phase==='setup')figure(false,.95);if(phase==='pose')figure(true);if(phase==='shoot')shots.forEach(paint);if(phase==='reveal'){figure(false,.92);shots.forEach(paint)}}
    function choose(id){creature=id;points=clone(def().points);shots=[];hits=new Set();bonus=0;panel();draw()}
    function panel(){const el=$('#panel');if(phase==='setup'){el.innerHTML=`<div><p class="eyebrow">01 · 选择藏匿生物</p><h2>这轮藏什么？</h2><p>画布会展示完整轮廓。选择后，藏匿方可以拖动所有关节改变姿势。</p></div><div class="creatures">${Object.entries(creatures).map(([id,c])=>`<button class="creature ${id===creature?'active':''}" data-creature="${id}"><b>${c.label}</b><small>${c.desc}</small></button>`).join('')}<button class="creature" id="random"><b>随机</b><small>从三种生物中抽取</small></button></div><div class="selected"><p class="eyebrow">当前预览</p><strong>${def().label}</strong><p>${def().desc}</p></div><button class="primary" id="startHide">确认形状，开始藏</button>`;el.querySelectorAll('[data-creature]').forEach(b=>b.onclick=()=>choose(b.dataset.creature));$('#random').onclick=()=>{const ids=Object.keys(creatures);choose(ids[Math.floor(Math.random()*ids.length)]);toast(`随机结果：${def().label}`)};$('#startHide').onclick=()=>go('pose')}
      else if(phase==='pose'){const n=overlaps(),ok=n<=2;el.innerHTML=`<div><p class="eyebrow">玩家 A · 藏 · ${def().label}</p><h2>改变它的姿势</h2><p>拖动红色关节；骨架会整体传力并回弹。</p></div><div class="meterbox ${ok?'':'danger'}"><div class="meterhead"><span>肢体重叠</span><b>${ok?'合格':'太多'}</b></div><div class="meter"><i style="width:${Math.min(100,n*18)}%"></i></div></div><button class="primary" id="lock" ${ok?'':'disabled'}>锁定并隐藏</button>`;$('#lock').onclick=()=>go('handoff')}
      else if(phase==='loadout'){el.innerHTML=`<div><p class="eyebrow">玩家 B · 找 · 局前装备</p><h2>携带部位扫描</h2><p>每次扫描只检查刚刚发射的那一发，并告诉你命中了头、躯干、腿、翅膀或尾巴等部位；不会透露该部位现在位于哪里。剩余提示跨局保留。</p></div><div class="shop"><p class="eyebrow">测试资源</p><div class="shoprow"><div><strong>${hints}</strong><small> 个扫描提示</small></div><div><b>${coins} ◆</b><br><small>${COST} ◆ / 个</small></div></div></div><div class="buttons"><button class="secondary" id="buy">兑换 1 个提示</button><button class="primary" id="beginShoot">不再购买，开始射击</button></div>`;$('#buy').onclick=buyHint;$('#beginShoot').onclick=()=>go('shoot')}
      else if(phase==='shoot'){const left=BULLETS-shots.length;el.innerHTML=`<div><p class="eyebrow">玩家 B · 找 · ${def().label}</p><h2>${left?'凭感觉开火':'弹药用尽'}</h2><p>不再自动提供文字检测。有效命中的彩弹会出现黑白双环；纯色彩弹表示没有新增命中。</p></div><div class="legend"><span><i class="swatch hit"></i> 黑白双环：有效命中</span><span><i class="swatch"></i> 纯色：未命中或无新增</span></div><div class="ammo"><div class="dots">${Array.from({length:BULLETS},(_,i)=>`<i class="${i<left?'':'off'}"></i>`).join('')}</div><strong>${left}<small> / ${BULLETS}</small></strong></div><div class="buttons"><button class="secondary" id="useHint">使用扫描提示（剩 ${hints}）</button><button class="primary" id="reveal" ${shots.length?'':'disabled'}>${left?'提前结算':'揭晓位置'}</button></div>`;$('#useHint').onclick=useHint;$('#reveal').onclick=()=>go('reveal')}
    }
    function updateSteps(){['Setup','Hide','Find','Reveal'].forEach(x=>$(`#step${x}`).classList.remove('on'));if(phase==='setup')$('#stepSetup').classList.add('on');if(['pose','handoff'].includes(phase))$('#stepHide').classList.add('on');if(['loadout','shoot'].includes(phase))$('#stepFind').classList.add('on');if(phase==='reveal')$('#stepReveal').classList.add('on')}
    function go(next){phase=next;$('#handoff').classList.toggle('hidden',phase!=='handoff');$('#result').classList.toggle('hidden',phase!=='reveal');canvas.className=phase==='pose'?'posecursor':phase==='shoot'?'shootcursor':'';updateSteps();if(phase==='reveal'){const total=samples().length,coverage=hits.size/total,good=shots.filter(s=>s.gain>0),hitReward=good.reduce((sum,s)=>sum+90*(s.headshot?1.5:1),0),b=Math.min(1000,Math.round(hitReward+coverage**.65*650));$('#scoreB').textContent=b;$('#scoreA').textContent=1000-b;$('#summary').textContent=`${def().label} · 有效命中 ${good.length}/${BULLETS} 发 · 覆盖 ${Math.round(coverage*100)}%${bonus?' · 含爆头加成':''}`}panel();draw()}
    function pos(e){const r=canvas.getBoundingClientRect(),target=W/H,box=r.width/r.height,cw=box>target?r.height*target:r.width,ch=box>target?r.height:r.width/target,ox=(r.width-cw)/2,oy=(r.height-ch)/2;return{x:(e.clientX-r.left-ox)/cw*W,y:(e.clientY-r.top-oy)/ch*H}}
    canvas.addEventListener('pointerdown',e=>{const p=pos(e);if(p.x<0||p.x>W||p.y<0||p.y>H)return;if(phase==='pose'){const handles=def().handles||Object.keys(points),near=handles.map(k=>[k,points[k]]).sort((a,b)=>distance(a[1],p)-distance(b[1],p))[0];if(near&&distance(near[1],p)<42){cancelAnimationFrame(jiggle);drag=near[0];lastDelta={x:0,y:0};canvas.setPointerCapture(e.pointerId)}}else if(phase==='shoot'&&shots.length<BULLETS){const body=samples(),next=new Set(hits),touched=new Set(),closest=shots.reduce((near,s)=>Math.min(near,distance(p,s)),Infinity);body.forEach((q,i)=>{if(distance(q,p)<=RADIUS+def().lineWidth/2){next.add(i);touched.add(q.part)}});const count=next.size-hits.size,gain=Math.round(count/body.length*1000),headshot=count>0&&touched.has('头部'),overlapNote=closest<=RADIUS*.35?'同一位置｜不会重复加分':closest<RADIUS*2?'彩弹部分重叠｜只计算新覆盖':'';shots.push({...p,gain,headshot,parts:[...touched],color:['#ff4f36','#2c59ff','#f7bb16','#e9348a'][shots.length%4]});hits=next;bonus+=headshot?count*.5:0;if(overlapNote)toast(overlapNote);panel();draw()}});
    canvas.addEventListener('pointermove',e=>{if(phase!=='pose'||!drag)return;const p=pos(e),target={x:Math.max(45,Math.min(W-45,p.x)),y:Math.max(45,Math.min(H-45,p.y))};lastDelta={x:target.x-points[drag].x,y:target.y-points[drag].y};points=solve(points,drag,target);panel();draw()});
    function release(){if(!drag)return;const joint=drag,base=clone(points),v=lastDelta,speed=Math.hypot(v.x,v.y);drag=null;if(speed<1.5)return;const dir={x:v.x/speed,y:v.y/speed},amp=Math.min(22,speed*.8),start=performance.now();function bounce(now){const t=Math.min(1,(now-start)/520),off=amp*(1-t)**2*Math.sin(t*Math.PI*5);points=solve(base,joint,{x:base[joint].x+dir.x*off,y:base[joint].y+dir.y*off});panel();draw();if(t<1)jiggle=requestAnimationFrame(bounce)}jiggle=requestAnimationFrame(bounce)}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
    function toast(text){const el=$('#toast');clearTimeout(toastTimer);el.textContent=text;el.classList.remove('hidden');el.style.animation='none';void el.offsetWidth;el.style.animation='';toastTimer=setTimeout(()=>el.classList.add('hidden'),1500)}
    function buyHint(){if(coins<COST){toast('测试货币不足');return}coins-=COST;hints++;persist();panel();toast('已兑换 1 个扫描提示')}
    function useHint(){if(!shots.length){toast('先发射一枚彩弹，再扫描这一发');return}if(hints<=0){$('#modal').classList.remove('hidden');return}hints--;persist();const last=shots[shots.length-1],parts=[...new Set(last.parts||[])];if(!parts.length)toast('扫描结果：刚刚这一发没有命中生物');else{const shown=parts.slice(0,2).join('、'),more=parts.length>2?'等部位':'';toast(`扫描结果：刚刚命中 ${shown}${more}`)}panel()}
    function restart(){shots=[];hits=new Set();bonus=0;choose('human');go('setup')}function fullscreen(){document.documentElement.requestFullscreen?.().catch(()=>{})}
    $('#toLoadout').onclick=()=>go('loadout');$('#again').onclick=restart;$('#reset').onclick=restart;$('#fullscreen').onclick=fullscreen;$('#cancelBuy').onclick=()=>$('#modal').classList.add('hidden');$('#confirmBuy').onclick=()=>{$('#modal').classList.add('hidden');buyHint()};resources();go('setup');
  })();
  </script>
